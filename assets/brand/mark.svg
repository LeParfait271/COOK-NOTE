<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Cook Note">
  <!-- Embleme Cook Note : une cloche de service en filets dores, centree, sans
       texte, sur fond noir chaud. Aucun filtre SVG (cout de rendu GPU). -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="72%">
      <stop offset="0" stop-color="#1d160e"/>
      <stop offset="1" stop-color="#070605"/>
    </radialGradient>
    <linearGradient id="gold" x1="30" y1="36" x2="98" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6dc9c"/>
      <stop offset=".55" stop-color="#d6a650"/>
      <stop offset="1" stop-color="#a8752a"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="11" y="11" width="106" height="106" rx="22" fill="none" stroke="#d6a650" stroke-opacity=".42" stroke-width="1.4"/>
  <g fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="64" cy="42.5" r="4" stroke-width="4"/>
    <path d="M34 82a30 30 0 0 1 60 0" stroke-width="4.6"/>
    <path d="M44.5 73a20 20 0 0 1 11.5-14.5" stroke-width="2.4" stroke-opacity=".55"/>
    <path d="M27 88h74" stroke-width="4.6"/>
  </g>
</svg>
