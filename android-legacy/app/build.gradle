plugins {
    id 'com.android.application'
}

def repoRoot = rootProject.projectDir.parentFile
def legacyAssetRoot = new File(repoRoot, 'android-legacy/build/generated/cook-note-lite')
def voiceModelAssetRoot = new File(repoRoot, 'android-legacy/build/generated/voice-model')
def androidVersionName = project.findProperty('cookNoteAndroidVersion') ?: ''
def versionMatch = androidVersionName =~ /^(\d+)\.(\d{2})$/
if (!versionMatch.find()) {
    throw new GradleException('cookNoteAndroidVersion invalide dans android-legacy/gradle.properties. Attendu: X.YY')
}
def major = versionMatch.group(1) as int
def minor = versionMatch.group(2) as int
def cookNoteVersionName = String.format('%d.%02d', major, minor)
def cookNoteVersionCode = (major * 1000) + minor

// Cle release hors Git : android-legacy/signing/ (ignore), voir docs/android-legacy-workflow.md.
def signingDir = new File(repoRoot, 'android-legacy/signing')
def signingProps = new Properties()
def signingPropsFile = new File(signingDir, 'keystore.properties')
if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}

android {
    namespace 'fr.cooknote.legacy'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.cooknote.legacy'
        minSdk 21
        targetSdk 35
        versionCode cookNoteVersionCode
        versionName cookNoteVersionName
    }

    androidResources {
        noCompress += ['json']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (signingPropsFile.exists()) {
                storeFile new File(signingDir, signingProps.getProperty('storeFile', 'cook-note-release.jks'))
                storePassword signingProps.getProperty('storePassword')
                keyAlias signingProps.getProperty('keyAlias', 'cooknote')
                keyPassword signingProps.getProperty('keyPassword')
            }
        }
    }

    // Vosk (reconnaissance vocale locale) : tablettes et telephones ARM ; x86_64
    // seulement dans l'APK de test (emulateur). L'APK publie doit rester sous
    // 100 Mo (limite GitHub par fichier).
    buildTypes {
        debug {
            ndk {
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
            }
        }
        release {
            ndk {
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // libvosk.so modifie pour Android 5 (src/main/jniLibs, voir
    // scripts/build-vosk-android-compat.ps1) prioritaire sur celui de l'AAR.
    packaging {
        jniLibs {
            pickFirsts += ['**/libvosk.so']
        }
    }

    sourceSets {
        main {
            // Modele vocal francais (assets/model-fr) prepare par
            // scripts/build-android-legacy-assets.js depuis voice-model/.
            assets.srcDirs = [legacyAssetRoot, voiceModelAssetRoot]
        }
    }
}

dependencies {
    // Mode mains libres : Vosk, reconnaissance vocale sur l'appareil (Apache 2.0).
    implementation 'com.alphacephei:vosk-android:0.3.47'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
}

tasks.register('syncCookNoteDist', Sync) {
    from(legacyAssetRoot)
    into(layout.projectDirectory.dir('build/generated/empty-sync-marker'))
    include('recipes-lite.json')
    doFirst {
        if (!legacyAssetRoot.exists()) {
            throw new GradleException('Assets Android Legacy Native Lite introuvables. Lance scripts/build-android-legacy-assets.js avant Gradle.')
        }
    }
}

preBuild.dependsOn('syncCookNoteDist')

tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    doFirst {
        if (!signingPropsFile.exists()) {
            throw new GradleException('Cle release absente : android-legacy/signing/keystore.properties introuvable.')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:deprecation']
}
